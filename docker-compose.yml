# ============================================
# NVIDIA Manufacturing Pipeline - Week 1 Complete
# Kafka → MinIO Bronze Layer (Databricks Week 2)
# ============================================

services:
  # ==========================================
  # ZOOKEEPER (Kafka Dependency)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: manufacturing-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - manufacturing-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # KAFKA BROKER
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: manufacturing-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      
      # Listener configuration
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Performance & retention settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      
      # Auto-create topics (dev only!)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - manufacturing-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================
  # KAFKA UI (Visualization & Monitoring)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: manufacturing-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: manufacturing-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - manufacturing-network

  # ==========================================
  # MINIO (S3-Compatible Object Storage)
  # Bronze Layer for Databricks Upload
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: manufacturing-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
    networks:
      - manufacturing-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==========================================
  # DATA GENERATOR (Synthetic Wafer Telemetry)
  # ==========================================
  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: manufacturing-generator
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # Kafka config (from .env)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wafer-telemetry}
      
      # MinIO config (from .env)
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      
      # Enable Python to reload on file changes (dev mode)
      PYTHONUNBUFFERED: 1
    volumes:
      - ./data-generator:/app
      - ./data-generator/output:/output
    networks:
      - manufacturing-network
    # Run both producer (generates data) and consumer (writes to MinIO)
    command: sh -c "python kafka_producer.py & python kafka_consumer.py"

# ==========================================
# NETWORKING & VOLUMES
# ==========================================
networks:
  manufacturing-network:
    driver: bridge
    name: manufacturing-network